<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 8px; }
        input { display: block; width: 100%; padding: 10px; margin: 8px 0 15px; }
        button { padding: 10px 18px; cursor: pointer; }
        .erro { color: red; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <h1>Cadastro de Alunos</h1>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <form method="post" action="/alunos">
        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Digite o nome do aluno">

        <label>Matrícula:</label>
        <input type="text" name="matricula" placeholder="Digite a matrícula">

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Alunos cadastrados</h2>
    <table th:if="${alunos != null and !alunos.isEmpty()}">
        <tr>
            <th>Nome</th>
            <th>Matrícula</th>
        </tr>
        <tr th:each="aluno : ${alunos}">
            <td th:text="${aluno.nome}"></td>
            <td th:text="${aluno.matricula}"></td>
        </tr>
    </table>

    <p th:if="${alunos == null or alunos.isEmpty()}">Nenhum aluno cadastrado ainda.</p>
</div>
</body>
</html>
